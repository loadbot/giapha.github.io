name: Supabase Direct Keep-Alive

on:
  schedule:
    # Changed from 23 to 47 to avoid "on-the-quarter-hour" traffic spikes
    - cron: '47 * * * *'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force Database Activity
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Use --retry to handle transient network blips automatically
          RESPONSE=$(curl -s -X GET "${URL}/rest/v1/clan_settings?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            --connect-timeout 10 \
            --retry 3 \
            -w "%{http_code}" \
            -o /dev/null)

          echo "Database Status: $RESPONSE"

          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Activity confirmed."
          else
            echo "❌ Error: Received status $RESPONSE"
            exit 1
          fi

      - name: Wake Up Frontend
        run: |
          # Added --retry so it doesn't fail if the frontend is just slow to wake up
          curl -sL -m 30 --retry 2 -A "Mozilla/5.0" https://giapha.la.id.vn/login -o /dev/null
          echo "✅ Frontend ping sent."
