name: Supabase Direct Keep-Alive

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force Database Activity
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Keep retry for the database as it is the most important part
          RESPONSE=$(curl -s -X GET "${URL}/rest/v1/clan_settings?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            --connect-timeout 10 \
            --retry 3 \
            -w "%{http_code}" \
            -o /dev/null)

          echo "Database Status: $RESPONSE"

          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Activity confirmed."
          else
            echo "❌ Error: Received status $RESPONSE"
            exit 1
          fi

      - name: Wake Up Frontend
        run: |
          # Use -I (Fetch headers only) to avoid "Exit Code 23" body-writing errors
          # This is the cleanest way to "ping" a web server
          curl -sI -m 30 -A "Mozilla/5.0" https://giapha.la.id.vn/login > /dev/null
          echo "✅ Frontend ping sent successfully."
