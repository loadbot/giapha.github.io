name: Supabase Direct Keep-Alive

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force Database Activity
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s -X GET "${URL}/rest/v1/clan_settings?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            --connect-timeout 10 \
            --retry 3 \
            -w "%{http_code}" \
            -o /dev/null)
          echo "Database Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then echo "✅ DB Active"; else exit 1; fi

      - name: Real GET - Storage Asset
        run: |
          STORAGE_URL="https://spweefkycqqhowjiptqs.supabase.co/storage/v1/object/public/media/favicon.png"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$STORAGE_URL")
          echo "Storage Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then echo "✅ Storage Active"; fi

      - name: Real GET - Frontend (Fix Exit 23)
        run: |
          FRONTEND_URL="https://giapha.la.id.vn/login"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          
          # Simplified curl to avoid 'Exit 23' write errors
          RESPONSE=$(curl -sL -A "$USER_AGENT" -w "%{http_code}" "$FRONTEND_URL" -o /dev/null)
          
          echo "Frontend Status: $RESPONSE"

          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Frontend Active."
          elif [ "$RESPONSE" -eq 429 ]; then
            echo "⚠️ Frontend Rate Limited (429), but server is awake."
          else
            echo "❌ Frontend returned $RESPONSE."
          fi
