name: Supabase Direct Keep-Alive

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force Database Activity
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X GET "${URL}/rest/v1/clan_settings?select=id&limit=1" \
          -H "apikey: ${KEY}" \
          -H "Authorization: Bearer ${KEY}" \
          -s -o /dev/null -w "Database Status: %{http_code}\n"

      - name: Wake Up Frontend
        run: |
          curl -sL -A "Mozilla/5.0" https://giapha.la.id.vn/login -o /dev/null
