name: Supabase Direct Keep-Alive

on:
  schedule:
    # Runs at minute 47 of every hour.
    # Non-standard minutes avoid GitHub traffic spikes.
    - cron: '47 * * * *'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force Database Activity
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Use --retry to handle transient network blips.
          # We check for a 200 status to confirm the DB is actually active.
          RESPONSE=$(curl -s -X GET "${URL}/rest/v1/clan_settings?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            --connect-timeout 10 \
            --retry 3 \
            -w "%{http_code}" \
            -o /dev/null)

          echo "Database Status: $RESPONSE"

          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Activity confirmed. Supabase timer reset."
          else
            echo "❌ Error: Received status $RESPONSE. Project may be paused or unreachable."
            exit 1
          fi

      - name: Wake Up Frontend
        run: |
          if curl -sL -m 30 -A "Mozilla/5.0" https://giapha.la.id.vn/login > /dev/null; then
            echo "✅ Frontend ping sent successfully."
          else
            echo "⚠️ Frontend ping failed, but server might still be waking up."
          fi
