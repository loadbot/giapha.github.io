name: Supabase Direct Keep-Alive

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force Database Activity
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s -X GET "${URL}/rest/v1/clan_settings?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            --connect-timeout 10 \
            --retry 3 \
            -w "%{http_code}" \
            -o /dev/null)
          [ "$RESPONSE" -eq 200 ] && echo "✅ DB Active" || exit 1

      - name: Real GET - Storage Asset
        run: |
          STORAGE_URL="https://spweefkycqqhowjiptqs.supabase.co/storage/v1/object/public/media/favicon.png"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$STORAGE_URL")
          echo "Storage Status: $RESPONSE"
          [ "$RESPONSE" -eq 200 ] && echo "✅ Storage Active" || echo "⚠️ Storage Issue"

      - name: Real GET - Frontend
        run: |
          FRONTEND_URL="https://giapha.la.id.vn/login"
          # -L follows redirects, -A simulates a browser user-agent
          RESPONSE=$(curl -sL -o /dev/null -A "Mozilla/5.0" -w "%{http_code}" "$FRONTEND_URL")
          echo "Frontend Status: $RESPONSE"
          [ "$RESPONSE" -eq 200 ] && echo "✅ Frontend Active" || echo "⚠️ Frontend Issue"
