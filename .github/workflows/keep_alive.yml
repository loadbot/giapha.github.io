name: Hourly Frontend Warmup

on:
  schedule:
    # Runs every 30 minutes at 23 and 53 past the hour
    - cron: '23,53 * * * *'
  workflow_dispatch: 

jobs:
  ping_site:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Login Page
        run: curl -sL -w "Status: %{http_code}\n" https://giapha.la.id.vn/login -o /dev/null
