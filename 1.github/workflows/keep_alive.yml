name: Hourly Frontend Warmup

on:
  schedule:
    # Runs every 30 minutes at "off-peak" times (e.g., 1:23, 1:53, 2:23...)
    # This avoids the '00' and '30' minute spikes where GitHub Actions are busiest.
    - cron: '23,53 * * * *'
  workflow_dispatch: 

jobs:
  ping_site:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Login Page
        # -s: Silent (no progress bar)
        # -L: Follow redirects (important for https/custom domains)
        # -w: Print the HTTP status code at the end
        run: |
          curl -sL -w "Status: %{http_code}\n" https://giapha.la.id.vn/login -o /dev/null